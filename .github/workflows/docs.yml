name: Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # actions/setup-python@v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Install documentation Python dependencies
        run: pip install -r doc/requirements-doc.txt

      - name: Install Doxygen
        run: sudo apt-get install doxygen -y
        shell: bash

      - name: Build documentation maintenance tool
        run: |
          cmake -S . -B cmake-build-doc -G Ninja -DCMAKE_BUILD_TYPE=Release -DERBSLAND_CORE_ENABLE_TESTS=OFF -DERBSLAND_CORE_ENABLE_TOOLS=ON
          cmake --build cmake-build-doc --target erbsland-core-tool -j 2

      - name: Prepare Doxygen input
        run: cmake-build-doc/tool/erbsland-core-tool doc-preprocess-sources

      - name: Build documentation
        run: sphinx-build doc _build
        env:
          ERBSLAND_CORE_TOOL: ${{ github.workspace }}/cmake-build-doc/tool/erbsland-core-tool

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' }}
        # actions/upload-pages-artifact@v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _build

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
