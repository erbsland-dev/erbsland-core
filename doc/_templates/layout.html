{%- extends "sphinx_rtd_theme/layout.html" %}

{% if hasdoc('genindex') %}
<ul class="el-sidebar-index">
    <li class="toctree-l1{% if pagename == 'genindex' %} current{% endif %}">
        <a class="reference internal{% if pagename == 'genindex' %} current{% endif %}" href="{{ pathto('genindex') }}">

<div class="banner">{{ banner }}</div>
{% endif %}
{{ super() }}
{% endblock %}
